# check.yml
# Run ShellCheck on all .sh files in the repository.
# Save in your repository as .github/workflows/check.yml and push.
# The job fails (red cross) if ShellCheck reports anything.
name: Check

on: push

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck version
        run: shellcheck --version

      # List the files that will be checked
      - name: List .sh files
        run: find . -name '*.sh' -not -path './.git/*' | sort

      # find returns a non-zero exit code if shellcheck reports anything
      - name: Run ShellCheck
        run: |
          find . -name '*.sh' -not -path './.git/*' \
            -exec shellcheck {} +
