# show-secrets-and-variables.yml
# Shows how a workflow reads a variable and a secret, and that the secret is hidden in the log.
# Save in your repository as .github/workflows/show-secrets-and-variables.yml and push.
# Needs the repository variable GREETING and the repository secret DEMO_SECRET.
name: Show secrets and variables

on: workflow_dispatch

jobs:
  show:
    runs-on: ubuntu-24.04
    env:
      GREETING: ${{ vars.GREETING }}
      DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
    steps:
      # Secrets cannot be used directly in if, so the check uses the environment variable
      - name: Check that the secret is set
        if: env.DEMO_SECRET == ''
        run: |
          echo "::error::The secret DEMO_SECRET is not set"
          exit 1

      # A variable is shown in plain text
      - name: Print the variable
        run: |
          echo "The variable GREETING is: $GREETING"

      # A secret is replaced by *** in the log
      - name: Print the secret
        run: |
          echo "The secret DEMO_SECRET is: $DEMO_SECRET"
