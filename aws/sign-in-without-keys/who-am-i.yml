# who-am-i.yml
# Sign in to AWS without keys and show who we are.
# Save in your repository as .github/workflows/who-am-i.yml and push to main.
# Start it with the Run workflow button in the Actions tab.
# Needs the repository variable AWS_ROLE_ARN (Settings, Secrets and variables, Actions, Variables).
name: Who am I in AWS

on: workflow_dispatch

permissions:
  id-token: write   # lets the job ask GitHub for an OIDC token
  contents: read

jobs:
  who-am-i:
    runs-on: ubuntu-24.04
    steps:
      # Exchange GitHub's token for temporary AWS credentials
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1   # change to your region

      - name: Who am I
        run: aws sts get-caller-identity
